<svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A3" />
      <stop offset="50%" stop-color="#D4A15A" />
      <stop offset="100%" stop-color="#B37E36" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(5, 6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0F172A" stroke="#D4A15A" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Outer Arch Shape -->
    <path d="M 6 12 C 18 6, 30 6, 42 12 C 43.5 12.5, 44 14, 44 15.5 V 34 C 44 38, 40 42, 36 42 H 12 C 8 42, 4 38, 4 34 V 15.5 C 4 14, 4.5 12.5, 6 12 Z" fill="url(#gold-grad)" fill-opacity="0.15" stroke="url(#gold-grad)" stroke-width="2" />
    <!-- Curved Scoop Banner Line -->
    <path d="M 6 14 Q 24 22 42 14" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-filter)" />
    <!-- Film Reel Aperture -->
    <circle cx="24" cy="28" r="7" stroke="url(#gold-grad)" stroke-width="2" fill="#050D1E" />
    <circle cx="24" cy="28" r="2.5" fill="url(#gold-grad)" />
    <!-- Shutter Rays -->
    <line x1="24" y1="18" x2="24" y2="21" stroke="#F4F1EA" stroke-width="1.5" stroke-linecap="round" />
    <line x1="17" y1="28" x2="14" y2="28" stroke="#F4F1EA" stroke-width="1.5" stroke-linecap="round" />
    <line x1="31" y1="28" x2="34" y2="28" stroke="#F4F1EA" stroke-width="1.5" stroke-linecap="round" />
    <line x1="24" y1="35" x2="24" y2="38" stroke="#F4F1EA" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="64" y="41" font-family="'Bebas Neue', sans-serif" font-size="34" font-weight="bold" fill="#F4F1EA" letter-spacing="2">CINE</text>
  <text x="132" y="41" font-family="'Bebas Neue', sans-serif" font-size="34" font-weight="bold" fill="url(#gold-grad)" letter-spacing="2" filter="url(#glow-filter)">SCOPE</text>
</svg>